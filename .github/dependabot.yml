# Weekly PRs for new image and library versions. CI boots each changed
# service before anything is merged, so updates are tested, not blind.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      images: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # Major versions of databases change the on-disk format and need a
      # manual migration, so they're upgraded deliberately, not by a bot.
      - dependency-name: mongo
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
      - dependency-name: elasticsearch
        update-types: [version-update:semver-major]
      - dependency-name: kibana
        update-types: [version-update:semver-major]
      - dependency-name: rabbitmq
        update-types: [version-update:semver-major]
      - dependency-name: apache/kafka
        update-types: [version-update:semver-major]
      # Tag scheme ("1.0.2-20-alpine3.19") confuses Dependabot into downgrades
      - dependency-name: mongo-express
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: docker
    directories: [/config/postgres, /config/qr]
    schedule: { interval: weekly }
    ignore:
      # "17-3.7" = Postgres 17 + PostGIS 3.7. A Postgres major needs pg_upgrade
      # and Dependabot reads the PostGIS part wrongly, so update it by hand.
      - dependency-name: postgis/postgis
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }

  - package-ecosystem: gomod
    directory: /examples/go
    schedule: { interval: monthly }
    groups: { go: { patterns: ["*"] } }
    commit-message: { prefix: "chore(examples)" }

  - package-ecosystem: npm
    directory: /examples/node
    schedule: { interval: monthly }
    groups: { node: { patterns: ["*"] } }
    commit-message: { prefix: "chore(examples)" }

  - package-ecosystem: pip
    directory: /examples/python
    schedule: { interval: monthly }
    groups: { python: { patterns: ["*"] } }
    commit-message: { prefix: "chore(examples)" }
