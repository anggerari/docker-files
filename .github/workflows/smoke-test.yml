name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly: catch upstream images that disappear or break
  workflow_dispatch:

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROFILES: "*"
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Start every service and wait for health checks
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check services respond
        run: |
          set -e
          docker compose exec -T postgres psql -U postgres -d app -tAc \
            "select count(*) from pg_extension where extname in ('postgis','vector')" | grep -q 2
          docker compose exec -T redis redis-cli ping | grep -q PONG
          curl -fsS http://127.0.0.1:9001/rustfs/console/health
          curl -fsS http://127.0.0.1:4171/ >/dev/null
          curl -fsS "http://127.0.0.1:9010/?data=ci" -o /dev/null
          curl -fsS http://127.0.0.1:8025/readyz
          for i in $(seq 30); do curl -fsS http://127.0.0.1:5050/login >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:5050/login >/dev/null

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose down -v
