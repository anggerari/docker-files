global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: stack
    static_configs:
      - targets: ["loki:3100", "alloy:12345", "grafana:3000"]

  # RabbitMQ ships a Prometheus endpoint; scraped only when the profile is running.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Scrape your own app running on the host - uncomment and set the port:
  # - job_name: my-app
  #   static_configs:
  #     - targets: ["host.docker.internal:8080"]
