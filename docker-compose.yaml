# Local development stack.
#
# Every service belongs to a profile, so nothing starts unless you ask for it.
# Pick profiles in .env (COMPOSE_PROFILES=postgres,redis) or on the command line:
#
#   docker compose --profile postgres --profile redis up -d
#   docker compose --profile "*" up -d        # everything
#
# Ports bind to 127.0.0.1 by default. Set BIND_ADDR=0.0.0.0 in .env to expose
# them on your network (and change the default passwords first).

name: docker-files

x-restart: &restart
  restart: unless-stopped

services:
  # ── PostgreSQL + PostGIS + pgvector ──────────────────────────────────────────────
  postgres:
    <<: *restart
    container_name: postgres
    image: docker-files/postgres:local
    build: ./config/postgres
    platform: ${POSTGRES_PLATFORM:-linux/amd64} # postgis has no arm64 build
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    <<: *restart
    container_name: pgadmin
    image: dpage/pgadmin4:9.19
    profiles: [postgres]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis + RedisInsight ──────────────────────────────────────────────
  redis:
    <<: *restart
    container_name: redis
    image: redis:8.6-alpine
    profiles: [redis]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis}
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redisinsight:
    <<: *restart
    container_name: redisinsight
    image: redis/redisinsight:3.10.2
    profiles: [redis]
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: local
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

  # ── RustFS (S3-compatible object storage, MinIO alternative) ─────────
  rustfs:
    <<: *restart
    container_name: rustfs
    image: rustfs/rustfs:1.0.7
    profiles: [s3]
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${S3_API_PORT:-9000}:9000"
      - "${BIND_ADDR:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── NSQ (message queue) ───────────────────────────────────────────────
  nsqlookupd:
    <<: *restart
    container_name: nsqlookupd
    image: nsqio/nsq:v1.3.0
    profiles: [nsq]
    command: /nsqlookupd
    ports:
      - "${BIND_ADDR:-127.0.0.1}:4160:4160"
      - "${BIND_ADDR:-127.0.0.1}:4161:4161"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4161/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nsqd:
    <<: *restart
    container_name: nsqd
    image: nsqio/nsq:v1.3.0
    profiles: [nsq]
    command: >-
      /nsqd
      --lookupd-tcp-address=nsqlookupd:4160
      --broadcast-address=${NSQ_BROADCAST_ADDRESS:-127.0.0.1}
      --data-path=/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:4150:4150"
      - "${BIND_ADDR:-127.0.0.1}:4151:4151"
    volumes:
      - nsq-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4151/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      nsqlookupd:
        condition: service_healthy

  nsqadmin:
    <<: *restart
    container_name: nsqadmin
    image: nsqio/nsq:v1.3.0
    profiles: [nsq]
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${NSQADMIN_PORT:-4171}:4171"
    depends_on:
      nsqlookupd:
        condition: service_healthy

  # ── MongoDB + mongo-express ───────────────────────────────────────────
  mongo:
    <<: *restart
    container_name: mongo
    image: mongo:8.0
    profiles: [mongo]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    # WiredTiger cache defaults to 50% of RAM; keep it small for laptops
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.25}"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-express:
    <<: *restart
    container_name: mongo-express
    image: mongo-express:1.0.2-20-alpine3.19
    profiles: [mongo]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-mongo}:${MONGO_PASSWORD:-mongo}@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy

  # ── Mailpit (catch-all SMTP + web inbox, MailHog replacement) ───────
  mailpit:
    <<: *restart
    container_name: mailpit
    image: axllent/mailpit:v1.34.0
    profiles: [mail]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    # health check is built into the image (/mailpit readyz)

  # ── Kafka (KRaft, no ZooKeeper) + Redpanda Console ───────────────────
  kafka:
    <<: *restart
    container_name: kafka
    image: apache/kafka:4.4.0
    profiles: [kafka]
    environment:
      CLUSTER_ID: docker-files-kafka-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1 # default 50 is overkill locally and slows the first consumer group
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-24}
      KAFKA_HEAP_OPTS: -Xms${KAFKA_HEAP:-512m} -Xmx${KAFKA_HEAP:-512m}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 20s
      retries: 15
      start_period: 20s

  kafka-console:
    <<: *restart
    container_name: kafka-console
    image: redpandadata/console:v3.15.0
    profiles: [kafka]
    environment:
      KAFKA_BROKERS: kafka:29092
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KAFKA_CONSOLE_PORT:-8088}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # ── RabbitMQ (with management UI) ─────────────────────────────────────
  rabbitmq:
    <<: *restart
    container_name: rabbitmq
    image: rabbitmq:4.4.1-management-alpine
    profiles: [rabbitmq]
    hostname: rabbitmq # data dir is keyed by hostname
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_ADDR:-127.0.0.1}:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  # ── Elasticsearch + Kibana ────────────────────────────────────────────
  elasticsearch:
    <<: *restart
    container_name: elasticsearch
    image: elasticsearch:9.5.7
    profiles: [search]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
      # Don't go read-only when your laptop disk is >90% full
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kibana:
    <<: *restart
    container_name: kibana
    image: kibana:9.5.7
    profiles: [search]
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: --max-old-space-size=${KIBANA_HEAP_MB:-768}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Keycloak (auth / OIDC) with a ready-made "dev" realm ─────────────
  keycloak:
    <<: *restart
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [keycloak]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx${KEYCLOAK_HEAP:-512m}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./config/keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro
    healthcheck:
      # image has no curl: talk HTTP over bash's /dev/tcp to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── Observability: Grafana + Prometheus + Loki + Alloy ────────────────
  prometheus:
    <<: *restart
    container_name: prometheus
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-3d}
      - --web.enable-remote-write-receiver
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    <<: *restart
    container_name: loki
    image: grafana/loki:3.7.9
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
      - ./config/loki/config.yaml:/etc/loki/config.yaml:ro
    # distroless image (no shell/wget), so no health check; `make check` verifies it

  alloy:
    <<: *restart
    container_name: alloy
    image: grafana/alloy:v1.22.0
    profiles: [observability]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # read-only access to Docker so Alloy can ship every container's logs to Loki
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    <<: *restart
    container_name: grafana
    image: grafana/grafana:13.2.7
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started

  # ── QR code generator ─────────────────────────────────────────────────
  qr:
    <<: *restart
    container_name: qr
    image: docker-files/qr:local
    build: ./config/qr
    profiles: [qr]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${QR_PORT:-9010}:8080"

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
  redisinsight-data:
  rustfs-data:
  nsq-data:
  mongo-data:
  mailpit-data:
  kafka-data:
  rabbitmq-data:
  elasticsearch-data:
  keycloak-data:
  prometheus-data:
  loki-data:
  grafana-data:
